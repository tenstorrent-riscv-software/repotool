name: CI

# Run on pull requests and on pushes to the default branch. Pushes to other
# branches are covered by their pull request, so they don't run twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs, since tags can be moved; Dependabot
# (.github/dependabot.yml) proposes updates.

# A newer push to the same pull request cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # test and typecheck run on each released Python version that
  # requires-python in pyproject.toml admits; add new releases to this list,
  # which typecheck shares through the YAML anchor, and to the classifiers in
  # pyproject.toml. lint runs once, since ruff's results don't depend on the
  # interpreter.
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: &python-versions ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check

  # Checking against the minimum version catches APIs too new for it; checking
  # against each newer one catches APIs those versions removed.
  typecheck:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: *python-versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy --python-version "${{ matrix.python-version }}" repotool.py

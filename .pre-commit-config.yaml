repos:
  - repo: local
    hooks:
      - id: lint
        name: ruff lint
        entry: just lint
        language: system
        pass_filenames: false
        types: [python]
      - id: typecheck
        name: mypy
        entry: just typecheck
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: just pytest
        language: system
        pass_filenames: false
        types: [python]
  # prek's built-in hooks: this configuration requires prek, not pre-commit.
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-json
      - id: check-yaml
      - id: check-symlinks
      - id: check-merge-conflict
